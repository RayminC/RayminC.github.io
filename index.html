<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Ray 的小工具入口：IP 計算機、MAC 轉換器、DiGi-DiGi 節拍器等">
<title>Ray 的小工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fdb'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='%23fff' opacity='.7'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='%23fff' opacity='.7'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --text: #1c2330;
  --muted: #5d6878;
  --border: #dde2ea;
  --accent: #2f6fdb;
  --work: #2f6fdb;
  --work-soft: #e4edfc;
  --life: #c2621b;
  --life-soft: #fbeadc;
  --note: #8a5a00;
  --note-soft: #fff4d6;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1b2129; --text: #e6eaf0; --muted: #9aa5b4;
    --border: #2d3640; --accent: #6ea0ff;
    --work: #6ea0ff; --work-soft: #1f2e48; --life: #f0a062; --life-soft: #3a2818;
    --note: #f1c25b; --note-soft: #3a3016;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --surface: #1b2129; --text: #e6eaf0; --muted: #9aa5b4;
  --border: #2d3640; --accent: #6ea0ff;
  --work: #6ea0ff; --work-soft: #1f2e48; --life: #f0a062; --life-soft: #3a2818;
  --note: #f1c25b; --note-soft: #3a3016;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  line-height: 1.55; -webkit-text-size-adjust: 100%;
}
a { color: inherit; text-decoration: none; }

.page { max-width: 960px; margin: 0 auto; padding: 40px 16px 48px; }
header h1 { margin: 0; font-size: 28px; letter-spacing: .02em; }
header p { margin: 6px 0 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 28px; }
.card {
  display: flex; flex-direction: column; gap: 10px; padding: 18px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow);
  transition: transform .12s ease, border-color .12s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card .top { display: flex; align-items: center; gap: 12px; }
.card h2 { margin: 0; font-size: 18px; flex: 1; }
.card p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.icon { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.icon svg { display: block; }
.icon.work { background: var(--work-soft); color: var(--work); }
.icon.life { background: var(--life-soft); color: var(--life); }
.ext { color: var(--muted); flex: none; }
.tag {
  display: inline-block; font-size: 12px; line-height: 1; padding: 4px 8px; border-radius: 999px;
  font-weight: 600; white-space: nowrap;
}
.tag.work { color: var(--work); background: var(--work-soft); }
.tag.life { color: var(--life); background: var(--life-soft); }
.note {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--note);
  background: var(--note-soft); border-radius: 6px; padding: 3px 8px; white-space: nowrap;
}
footer { margin-top: 40px; color: var(--muted); font-size: 13px; text-align: center; }

@media (max-width: 520px) {
  .page { padding-top: 28px; }
  header h1 { font-size: 24px; }
  .grid { grid-template-columns: 1fr; gap: 12px; }
}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Ray 的小工具</h1>
    <p>工作上常用的網路小工具，點一下就打開</p>
  </header>

  <div class="grid" id="tools">
    <noscript><p>這一頁需要開啟 JavaScript 才會顯示工具清單。</p></noscript>
  </div>

  <footer>最後更新 2026-11-01</footer>
</main>

<script>
// 新增工具：在 TOOLS 加一筆，tag 用 work（工作）或 life（生活）；要邀請才能用的工具寫 note
const TOOLS = [
  { name: 'IP 計算機', desc: '輸入 IP 和遮罩，算出網段、廣播、可用範圍與萬用遮罩', tag: 'work', icon: 'ip', url: 'https://rayminc.github.io/ip-calculator/' },
  { name: 'MAC 轉換器', desc: '把 MAC 轉成小寫冒號格式，並查 IEEE 登記組織', tag: 'work', icon: 'mac', url: 'https://rayminc.github.io/mac-tool/' },
  { name: '今天吃啥', desc: '不知道吃什麼時，從附近的店幫你挑一家', tag: 'life', icon: 'food', url: 'https://7sha.rayminc.workers.dev/', note: '需要邀請連結' },
  { name: 'DiGi-DiGi 節拍器', desc: '超慢跑用的節拍器，一拍一步，背景場景跟著拍子動', tag: 'life', icon: 'beat', url: 'https://rayminc.github.io/digi-digi/' }
];

const ICONS = {
  ip: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="16.5" width="6" height="5" rx="1"/><rect x="15.5" y="16.5" width="6" height="5" rx="1"/><path d="M12 7.5v4M5.5 16.5v-2.5h13v2.5M12 11.5v2.5"/></svg>',
  mac: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/><path d="M9.5 9.5h5v5h-5z"/></svg>',
  beat: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l4 18H5L9 3Z"/><path d="M7 16h10"/><path d="M12 16l4-9"/></svg>',
  food: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18a9 9 0 0 1-18 0Z"/><path d="M8 8c0-1.5 1-2 1-3.5M12 8c0-1.5 1-2 1-3.5M16 8c0-1.5 1-2 1-3.5"/></svg>'
};
const EXT = '<svg class="ext" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const TAG_TEXT = { work: '工作', life: '生活' };

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

document.getElementById('tools').innerHTML = TOOLS.map(t => `
  <a class="card" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">
    <div class="top"><span class="icon ${t.tag}" aria-hidden="true">${ICONS[t.icon] || ''}</span><h2>${esc(t.name)}</h2>${EXT}</div>
    <p>${esc(t.desc)}</p>
    <div class="meta"><span class="tag ${t.tag}">${TAG_TEXT[t.tag]}</span>${t.note ? `<span class="note">🔒 ${esc(t.note)}</span>` : ''}</div>
  </a>`).join('');
</script>
</body>
</html>
